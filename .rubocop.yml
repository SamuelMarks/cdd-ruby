AllCops:
  NewCops: enable
  SuggestExtensions: false
  UseCache: false
  Exclude:
    - 'vendor/**/*'
    - 'build/**/*'
    - 'coverage/**/*'
    - 'dist/**/*'
    - 'rubies/**/*'
    - 'docs/**/*'
    - '.yardoc/**/*'
    - 'bin/**/*'
    - 'dummy_server/**/*'
    - 'dummy_tests_output.rb'
    - 'test_*_out/**/*'
    - 'test_*_out_cli/**/*'

Layout/LineLength:
  Max: 120
  AllowHeredoc: true
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 35
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'

Metrics/ClassLength:
  Max: 300
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'

Metrics/ModuleLength:
  Max: 350
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'

Metrics/BlockLength:
  Max: 35
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'spec/**/*'

Metrics/AbcSize:
  Max: 40
  Exclude:
    - 'spec/**/*'

Metrics/CyclomaticComplexity:
  Max: 12
  Exclude:
    - 'spec/**/*'

Metrics/PerceivedComplexity:
  Max: 12
  Exclude:
    - 'spec/**/*'

Metrics/BlockNesting:
  Max: 3
  Exclude:
    - 'spec/**/*'

Naming/MethodParameterName:
  AllowedNames:
    - id
    - io
    - ip
    - ir
    - op
    - rb
    - ex
    - ed
    - k
    - v
    - p
    - r
    - s
    - t
    - i
    - j

Naming/AccessorMethodName:
  Enabled: true
  Exclude:
    - 'src/cdd.rb'

Naming/PredicateMethod:
  AllowedMethods:
    - ping

Style/Documentation:
  Exclude:
    - 'spec/**/*'
